<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>退休倒计时 ⏳</title>
  <link rel="shortcut icon" type="image/x-icon" href="../../src/img/favicon.ico" />
  <link rel="stylesheet" href="../../src/css/tux.css">
</head>

<body>

  <div class="page-title">退休倒计时</div>
  <div class="tuxbox">
    <!-- 男性卡片 -->
    <div class="retire-card card-male">
      <div class="card-header">
        <div class="avatar-wrapper">
          <div class="avatar">🧑</div>
        </div>
        <div class="header-info">
          <div class="gender-label">男性</div>
          <div class="birth-info">1990年10月</div>
        </div>
      </div>

      <div class="card-main">
        <div class="countdown-section">
          <div class="countdown-label">距离退休还有</div>
          <div class="countdown-days">
            <span class="days-number tf-days">0</span>
            <span class="days-unit">天</span>
          </div>
          <div class="countdown-years tf-years-months-days">约0年0月0日</div>
          <div class="retire-congrats tf-retire-congrats" style="display: none;">🎉 恭喜退休！</div>
        </div>

        <div class="work-progress">
          <div class="progress-header">
            <span class="progress-title">上班进度</span>
            <span class="progress-value tf-percent">0%</span>
          </div>
          <div class="progress-bar-wrapper">
            <div class="progress-bar">
              <div class="progress-fill tf-progress"></div>
            </div>
            <div class="progress-labels">
              <span class="age-start">0岁</span>
              <span class="age-end">63岁</span>
            </div>
          </div>
          <div class="retire-age-info">
            <span class="retire-age-text">退休年龄是</span>
            <span class="retire-age-number tf-retire-age">63岁</span>
            <span class="retire-age-delay">（延<span class="tf-delay-years">0</span>年 <span class="tf-retire-weekday">星期x</span>）</span>
          </div>
        </div>
      </div>

      <div class="card-footer">
        <div class="footer-grid">
          <div class="footer-item">
            <div class="item-left">
              <span class="item-label">法定退休年龄</span>
            </div>
            <span class="item-value">60岁</span>
          </div>
          <div class="footer-item">
            <div class="item-left">
              <span class="item-icon">️</span>
              <span class="item-label">延迟月数</span>
            </div>
            <span class="item-value">36个月</span>
          </div>
        </div>
        <div class="footer-grid">
          <div class="footer-item">
            <div class="item-left">
              <span class="item-icon"></span>
              <span class="item-label">退休日期</span>
            </div>
            <span class="item-value">2053年10月</span>
          </div>
          <div class="footer-item">
            <div class="item-left">
              <span class="item-icon"></span>
              <span class="item-label">当前年龄(周岁)</span>
            </div>
            <span class="item-value tf-current-age">0岁</span>
          </div>
        </div>
      </div>
    </div>

    <!-- 女性卡片 -->
    <div class="retire-card card-female">
      <div class="card-header">
        <div class="avatar-wrapper">
          <div class="avatar">👩</div>
        </div>
        <div class="header-info">
          <div class="gender-label">女性</div>
          <div class="birth-info">1992年02月</div>
        </div>
      </div>

      <div class="card-main">
        <div class="countdown-section">
          <div class="countdown-label">距离退休还有</div>
          <div class="countdown-days">
            <span class="days-number xue-days">0</span>
            <span class="days-unit">天</span>
          </div>
          <div class="countdown-years xue-years-months-days">约0年0月0日</div>
          <div class="retire-congrats xue-retire-congrats" style="display: none;">🎉 恭喜退休！</div>
        </div>

        <div class="work-progress">
          <div class="progress-header">
            <span class="progress-title">上班进度</span>
            <span class="progress-value xue-percent">0%</span>
          </div>
          <div class="progress-bar-wrapper">
            <div class="progress-bar">
              <div class="progress-fill xue-progress"></div>
            </div>
            <div class="progress-labels">
              <span class="age-start">0岁</span>
              <span class="age-end">55岁</span>
            </div>
          </div>
          <div class="retire-age-info">
            <span class="retire-age-text">退休年龄是</span>
            <span class="retire-age-number xue-retire-age">55岁</span>
            <span class="retire-age-delay">（延<span class="xue-delay-years">0</span>年 <span class="xue-retire-weekday">星期x</span>）</span>
          </div>
        </div>
      </div>

      <div class="card-footer">
        <div class="footer-grid">
          <div class="footer-item">
            <div class="item-left">
              <span class="item-label">法定退休年龄</span>
            </div>
            <span class="item-value">50岁</span>
          </div>
          <div class="footer-item">
            <div class="item-left">
              <span class="item-icon">️</span>
              <span class="item-label">延迟月数</span>
            </div>
            <span class="item-value">60个月</span>
          </div>
        </div>
        <div class="footer-grid">
          <div class="footer-item">
            <div class="item-left">
              <span class="item-icon"></span>
              <span class="item-label">退休日期</span>
            </div>
            <span class="item-value">2047年02月</span>
          </div>
          <div class="footer-item">
            <div class="item-left">
              <span class="item-icon"></span>
              <span class="item-label">当前年龄(周岁)</span>
            </div>
            <span class="item-value xue-current-age">0岁</span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script src="../../src/js/lib/jquery-2.1.1.min.js"></script>
  <script src="../../src/js/lib/dateformat.js"></script>
  <script src="../../src/js/lib/adjust.js"></script>
  <script src="./lib/index.js"></script>
</body>

</html>
